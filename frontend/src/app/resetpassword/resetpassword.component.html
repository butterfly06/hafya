<h2>Réinitialiser le mot de passe</h2>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <input type="password" formControlName="password" placeholder="Nouveau mot de passe" />
  <input type="password" formControlName="confirmPassword" placeholder="Confirmer le mot de passe" />
  <button type="submit" [disabled]="form.invalid">Réinitialiser</button>
</form>

<p class="success" *ngIf="message">{{ message }}</p>
<p class="error" *ngIf="error">{{ error }}</p>
