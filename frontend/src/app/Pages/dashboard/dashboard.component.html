<!-- Header -->
<header>
  <span style="color: red;">h-</span>
  <span style="color: blue;">Afya</span>
  
  <div *ngIf="type === 'patient'"class="subtitle">Compte patient de {{ patient?.sexe ? (patient?.sexe === 'Homme' ? 'Mr' : 'Mme') : '' }} {{ patient?.prenom }}</div>
  <div *ngIf="type === 'praticien'"class="subtitle">Compte praticien de {{ praticien?.sexe ? (praticien?.sexe === 'Homme' ? 'Mr' : 'Mme') : '' }} {{ praticien?.prenom }}</div>

</header>


<!-- Patient Image Upload -->
<div *ngIf="type === 'patient'"  class="patient-circle">
  <img
    [src]="patient?.image"
    class="profile-image"
  />
</div>

<!-- Praticien Image Upload -->
<div *ngIf="type === 'praticien'"  class="praticien-circle">
  <img
    [src]="praticien?.image"
    class="profile-image"
  />
</div>

<button mat-button (click)="createNewNotification()">Create Test Notification</button>


<!-- Main Action Buttons Grid -->
<div class="grid">
  <button (click)="openCalendrier()">📅<br>Planning des rendez-vous</button>
  <button>📝<br>Préparer la consultation</button>
  <button>🏥<br>Condition médicale</button>
  <button>💡<br>Conseils (Divers & Info)</button>
</div>

<!-- Search Input -->
<div class="search-container">
  <input type="text" placeholder="Écrire le nom, la spécialité, l’établissement, l’adresse ou l’acte médical..." class="search-input" />
</div>

<!-- Floating Help Button -->
<div class="help-button" (click)="toggleChatbot()">
  <div class="help-icon">💬</div>
  <div class="help-label">Aide</div>
</div>

<!-- Footer Navigation -->
<footer class="footer">
  <nav>
    <!-- <mat-chip-list> -->
      <mat-chip>
        <mat-icon>home</mat-icon>
        Accueil
      </mat-chip>
      <mat-chip >
  <!-- other header items -->
  <app-notification-bell></app-notification-bell>
        <!-- <mat-icon>notifications</mat-icon> -->
        Notifications
      </mat-chip>
      <mat-chip>
        <mat-icon>mail</mat-icon>
        Messagerie
      </mat-chip>
<!-- </mat-chip-list> -->
      <!-- Profile Menu Trigger -->
      <button mat-button [matMenuTriggerFor]="profileMenu" *ngIf="type === 'patient'">
        <mat-icon>account_circle</mat-icon>
      Profil Patient
      </button>

        <button mat-button [matMenuTriggerFor]="profileMenu" *ngIf="type === 'praticien'">
      <mat-icon>account_circle</mat-icon>
         Profil Praticien
      </button>

      <!-- Profile Dropdown Menu -->
      <mat-menu #profileMenu="matMenu">
        <button *ngIf="type === 'patient'" mat-menu-item (click)="Moncompte()">
          <mat-icon>person</mat-icon>
          <span>Mon compte Patient</span>
        </button>

         <button *ngIf="type === 'praticien'" mat-menu-item (click)="MoncomptePraticien()"> 
          <mat-icon>person</mat-icon>
          <span>Mon compte Praticien</span>
        </button>
        
          <button mat-menu-item (click)="openPopup()"><span>À propos</span></button>

  
             <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Déconnexion</span>
        </button>
      </mat-menu>
    
  </nav>
</footer>
