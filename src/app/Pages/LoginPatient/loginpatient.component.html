<div class="container">
    <mat-card>
        <mat-card-header>
            <span style="color: red;">h-</span>
            <span style="color: blue;">Afya</span>

            <div>
                <button class="btnback" (click)="goBack()">
                    ← Retour
                </button>
            </div>
            <div class="titre">
                <p>Compte patient</p>
                <p>Vous être entrain d’accéder à votre compte</p>
            </div>
        </mat-card-header>
        <mat-card-content>
            <form (ngSubmit)="onSubmit()" #loginForm="ngForm" name="loginForm">
                <mat-form-field>
                    
                <input type="email" name="email" [(ngModel)]="loginData.email" placeholder="Email" required />
                    
                </mat-form-field>
                <mat-form-field>
                    
                <input type="password" name="password" [(ngModel)]="loginData.password" placeholder="Password"
                    required />
                    
                </mat-form-field>

                
        
            <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
                <button type="submit">Login</button>
                
           
            </form>
        </mat-card-content>

    </mat-card>

</div>
